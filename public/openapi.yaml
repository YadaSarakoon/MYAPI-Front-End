                      address: 99/9
                      subDistrict: เกาะขวาง
                      district: เมืองจันทบุรี
                      province: จันทบุรี
                      zipCode: '22000'
        '400':
          description: Bad Request
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
