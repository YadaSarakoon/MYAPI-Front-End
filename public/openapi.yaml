      summary: Get Sender COD
      description: |-
        ![](assets/sender-cod-example.png)

        ##### Request Query Params

        | Name | **Description** | Type | **Additional information** |
        | --- | --- | --- | --- |
        | email | Email ของผู้ส่ง COD _**\*กำหนดการค้นหา email จำเป็นต้องใส่ email ตาม email pattern**_\_\_\_\__\*_  
        _ตัวอย่างเช่น  
        Valid_:  
        \- [test@example.com](mailto:test@example.com)  
        _Invalid_:  
        \- test@.com  
        \- test@domain  
        \- @domain.com | String | Optional Condition  
        ( จำเป็นต้องใส่การค้นหาด้วย email หรือ phoneNumber หรือ ค้นหาทั้ง email และ phoneNumber ) |
        | phoneNumber | เบอร์โทร ของผู้ส่ง COD _**\*กำหนดการค้นหา เบอร์โทรต้อง มากกว่า 9 ตัว และไม่เกิน 10**_ _ตัว\*_ | Number | Optional Condition  
        ( จำเป็นต้องใส่การค้นหาด้วย email หรือ phoneNumber หรือ ค้นหาทั้ง email และ phoneNumber ) |

        ##### **Response**

        | Name | **Description** | Type |
        | --- | --- | --- |
        | data | ข้อมูลผู้ส่ง COD | Array |

