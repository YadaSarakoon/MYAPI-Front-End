  /v1/print-label:
    post:
      tags:
        - Print Label
      summary: Print Label
      description: |-
        #### Request Body

        | Name | Description | Type | Additional information |
        | --- | --- | --- | --- |
        | size | ขนาดใบลาเบล  
        **ค่าที่เป็นไปได้**:  
        TSC\_100\_75, TSC\_100\_100, TSC\_100\_150, TSC\_100\_180, MINI\_57\_100 | String | **Required** |
        | parcelIds | รหัสพัสดุ  
        **เงื่อนไข** : ต้องเป็นอาร์เรย์ของรหัสพัสดุที่ต้องการ โดยจะต้องไม่เป็นค่าว่างและต้องมีจำนวนไม่เกิน 20 รายการ | String\[\] | **Required** |

        #### Response

        Response จะส่งกลับมาเป็นไฟล์ PDF ในรูปแบบของ `blob` โดยผู้ใช้งานสามารถใช้ข้อมูลที่ได้รับเพื่อนำไปแสดงผลหรือดาวน์โหลดไฟล์ PDF ได้

        **Response Headers:**

        *   `Content-Type`: `application/pdf`
            
            *   ระบุว่าการตอบกลับเป็นไฟล์ประเภท PDF
        *   `Content-Disposition`: `attachment;filename={timestamp}.pdf`
            
            *   ระบุให้ไฟล์ถูกดาวน์โหลดลงในเครื่องของผู้ใช้งาน โดยไฟล์จะถูกตั้งชื่อด้วย timestamp ของเวลาที่สร้างไฟล์ (เช่น `attachment;filename=1691927258234.pdf`)

        **Response Body:**

        *   ไฟล์ PDF จะถูกส่งกลับมาในรูปแบบของ Binary Data (`blob`)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                size: TSC_100_75
                parcelIds:
                  - 7b50a746b657a0c5e96ba46888afe37b2389be97c298e3774f64fcfd9f9a575fOP1723535199935
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          description: Add Access token here
          example: Bearer <YOUR_ACCESS_TOKEN>
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
                example: text/html
            content-disposition:
              schema:
                type: string
                example: attachment;filename=1723543704932.pdf
          content:
            text/plain:
              schema:
                type: string
              example: ''
        '400':
          description: Bad Request
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
              example:
                status: 400
                message: The number of parcel IDs must be greater than 0 and not exceed the limit of 20. Please adjust the number of parcel IDs and try again.
                name: BadRequestException
        '404':
          description: Not Found
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
              example:
                status: 404
                message: No parcels found for the given reference IDs with this account.
                name: NotFoundException
        default:
          description: default
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
              example:
                status: 400
                message: The number of parcel IDs must be greater than 0 and not exceed the limit of 20. Please adjust the number of parcel IDs and try again.
                name: BadRequestException
  /v1/account/sender-cod/image:
    post:
      tags:
        - Verify COD Account
      summary: Upload Image by File
      description: |-
        #### Request Body

        | Name | Description | Type | Additional information |
        | --- | --- | --- | --- |
        | file | ไฟล์รูปภาพ  
        **ชนิดไฟล์ที่เป็นไปได้**:  
        png, jpg | File | **Required** |
        | type | ชนิดของรูปภาพ  
        **ค่าที่เป็นไปได้**:  
        BOOKBANK, ID\_CARD, PERSON\_ID\_CARD, CERTIFICATE | String | **Required** |

        สำหรับการอัปโหลดไฟล์เพื่อยืนยันตัวตนในระบบ แบ่งออกเป็น 2 ประเภทหลัก ดังนี้:

        ### 1\. บุคคลธรรมดา:

        ผู้ใช้งานที่เป็นบุคคลธรรมดาจะต้องทำการอัปโหลดไฟล์รูปภาพตามรายละเอียดดังต่อไปนี้:

        *   **ภาพถ่ายบัตรประชาชน:** ผู้ใช้งานต้องอัปโหลดไฟล์รูปภาพบัตรประชาชนที่ชัดเจน โดยระบุ **type** ใน request body เป็น **ID\_CARD**
            
        *   **ภาพถ่ายหน้าสมุดบัญชีธนาคาร:** ผู้ใช้งานต้องอัปโหลดไฟล์รูปภาพหน้าสมุดบัญชีธนาคารที่แสดงข้อมูลบัญชีชัดเจน โดยระบุ **type** ใน request body เป็น **BOOKBANK**
            
        *   **ภาพถ่ายหน้าตรงคู่กับบัตรประชาชน:** ผู้ใช้งานต้องอัปโหลดไฟล์รูปภาพที่ถ่ายหน้าตรงพร้อมถือบัตรประชาชนแนบกับใบหน้า โดยระบุ **type** ใน request body เป็น **PERSON\_ID\_CARD**
            

        ### 2\. นิติบุคคล:

        ผู้ใช้งานที่เป็นนิติบุคคลจะต้องทำการอัปโหลดไฟล์รูปภาพตามรายละเอียดดังต่อไปนี้:

        *   **ภาพถ่ายหนังสือรับรองบริษัท:** ผู้ใช้งานต้องอัปโหลดไฟล์รูปภาพหนังสือรับรองบริษัทที่ออกโดยหน่วยงานราชการหรือผู้มีอำนาจ โดยระบุ **type** ใน request body เป็น **CERTIFICATE**
            
        *   **ภาพถ่ายหน้าสมุดบัญชีธนาคาร:** ผู้ใช้งานต้องอัปโหลดไฟล์รูปภาพหน้าสมุดบัญชีธนาคารที่แสดงข้อมูลบัญชีของบริษัท โดยระบุ **type** ใน request body เป็น **BOOKBANK**
            

        ### รูปแบบไฟล์ที่รองรับ:

        ระบบรองรับการอัปโหลดไฟล์รูปภาพในรูปแบบต่อไปนี้:

        *   **image/jpeg**
            
        *   **image/png**
            

        ### ข้อกำหนดการอัปโหลด:

        *   ผู้ใช้งานสามารถอัปโหลดได้ครั้งละ 1 ไฟล์ต่อชนิดของรูปภาพในแต่ละคำขอ (Request) เท่านั้น
            
        *   หลังจากการอัปโหลดไฟล์สำเร็จ ระบบจะคืนค่าที่อยู่ไฟล์ (Directory) เพื่อให้ผู้ใช้งานนำไปใช้ในขั้นตอนการสมัครบัญชี COD ในขั้นตอนถัดไป
            
        *   ขนาดของไฟล์รูปภาพจะต้องไม่เกิน 20 MB
            

        หากมีข้อผิดพลาดในการอัปโหลดไฟล์หรือชนิดของไฟล์ไม่ถูกต้อง ระบบจะตอบกลับด้วยข้อความแสดงข้อผิดพลาด (Error Message) เพื่อแจ้งให้ผู้ใช้งานทราบถึงปัญหาในการอัปโหลด

        #### Response

        | **Name** | **Detail** | **Type** |
        | --- | --- | --- |
        | directory | ที่อยู่ไฟล์ | String |
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: sample.png (รับค่าเป็น FILE)
                  format: binary
                type:
                  type: string
                  example: BOOKBANK
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer <YOUR_ACCESS_TOKEN>
        - name: Content-Type
          in: header
          schema:
            type: string
          example: 'multipart/form-data; '
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
              examples:
                example-0:
                  summary: Success (หน้าสมุดบัญชีธนาคาร)
                  value:
                    directory: mxp-bookbank-cod-image/mxp-bookbank-cod-image/xxxxxxxxxxxxxxxxx_xxxxxxxxxxxx.png
                example-1:
                  summary: Success (บัตรประชาชน)
                  value:
                    directory: mxp-identification-cod-image/mxp-identification-cod-image/idCard_xxxxxxxxxxxxxxxxx_xxxxxxxxxxxx.png
                example-2:
                  summary: Success (รูปคู่บัตรประชาชน)
                  value:
                    directory: mxp-identification-cod-image/mxp-identification-cod-image/PersonIdCard_xxxxxxxxxxxxxxxxx_xxxxxxxxxxxx.png
                example-3:
                  summary: Success (หนังสือรับรองบริษัท)
                  value:
                    directory: mxp-identification-cod-image/mxp-identification-cod-image/Cert_xxxxxxxxxxxxxxxxx_xxxxxxxxxxxx.png
        '400':
          description: Bad Request
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
              examples:
                example-0:
                  summary: Error 400 No File Attach
                  value:
                    status: 400
                    message: File is required.
                    name: BadRequestException
                example-1:
                  summary: Error 400 Required Type
                  value:
                    status: 400
                    message: Type is required.
                    name: BadRequestException
                example-2:
                  summary: Error 400 Invalid Type
                  value:
                    status: 400
                    message: Invalid type.
                    name: BadRequestException
                example-3:
                  summary: Error 400 Multiple Files
                  value:
                    status: 400
                    message: You can upload only one file.
                    name: BadRequestException
