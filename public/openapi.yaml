      summary: Check Payment Status
      description: |-
        ##### Request Query Params

        | Name | **Description** | Type | **Additional information** |
        | --- | --- | --- | --- |
        | trackingNumber | เลขพัสดุ | String | Required |

        ##### **Response**

        | **Name** | **Description** | **Type** |
        | --- | --- | --- |
        | trackingNumber | เลขพัสดุ | String |
        | codTransferStatus | ประกอบด้วย 3 สถานะ  
        "NONE" พัสดุยังไม่ถูกจัดส่งหรือยังไม่ถึงปลายทาง  
        "PENDING" พัสดุถึงปลายทาง และรอทำรายการโอนเงิน  
        "TRANSFERRED" ทำรายการโอนเงินเรียบร้อยแล้ว  
        "REJECTED" ยกเลิกรายการโอน เนื่องจากพัสดุตีกลับ | String |
        | codTransferDate | วันที่ทำรายการโอนเงินเรียบร้อยแล้ว | String |
        | shippingCost |  | Object |
        | shippingCost.totalAmount | ราคาต้นทุนรวมทั้งหมด | Number |
        | shippingCost.shippingCost | ราคาต้นทุนขนส่ง | Number |
