  /v1/parcel/tracking:
    post:
      tags:
        - Parcel
      summary: Get Parcel
      description: |-
        #### Request Body

        | Name | Description | Type | Additional information |
        | --- | --- | --- | --- |
        | express | ชื่อขนส่ง | String | required = **"THAI\_POST"** |
        | trackingNumbers | เลข trackingNumber | String\[\] | required = ex.**[  "TH0001",  "TH0002",...]** |

        #### Response

        | Name | Description | Type |
        | --- | --- | --- |
        | notFoundTrackingNumbers | เลข tracking ที่ค้นหาไม่พบ | String\[\] |
        | express | ชื่อขนส่ง | String |
        | data.note | ข้อมูลเพิ่มเติม | String |
        | data.receiver.address | ที่อยู่ผู้ส่ง | String |
        | data.receiver.district | อำเภอผู้ส่ง | String |
        | data.receiver.name | ชื่อผู้ส่ง | String |
        | data.receiver.phoneNumber | เบอร์โทรผู้ส่ง | String |
        | data.receiver.province | จังหวัดผู้ส่ง | String |
        | data.receiver.subDistrict | ตำบลผู้ส่ง | String |
        | data.receiver.zipCode | รหัสไปรษณีย์ผู้ส่ง | String |
        | id | รหัส Parcel | String |
        | data.sender.address | ที่อยู่ผู้รับ | String |
        | data.sender.district | อำเภอผู้รับ | String |
        | data.sender.name | ชื่อ | String |
        | data.sender.phoneNumber | เบอร์โทรผู้รับ | String |
        | data.sender.province | จังหวัดผู้รับ | String |
        | data.sender.subDistrict | ตำบลผู้รับ | String |
        | data.sender.zipCode | รหัสไปรษณีย์ผู้รับ | String |
        | shipping.express | ชื่อขนส่งจากข้อมูลขนส่ง | String |
        | shipping.trackingNumber | เลข tracking | String |
        | shipping.weightGram | น้ำหนักที่บันทึกจาก **(กรัม)** ขนส่ง | Number |
        | shipping.statusLog.code | log Code ข้อมูลจากขนส่ง | String |
        | shipping.statusLog.timestamp | เวลาจากสถานะขนส่ง | Date |
        | shipping.statusLog.message | ข้อมูลสถานะ จากขนส่ง | String |
        | shipping.statusLog.weightGram | น้ำหนัก **(กรัม)** ที่บันทึกจากขนส่ง ใน log | Number |
        | shipping.statusLog.trackingNumber | เลข tracking จากขนส่งบันทึกจาก log | String |
        | status | สถานะการขนส่งล่าสุด | String |
        | type | ชนิดพัสดุ | String |
        | createdAt | วันที่สร้าง | Date |
        | updatedAt | วันที่อัพเดท | Date |
        | weightGram | น้ำหนักที่บันทึกจากระบบ **(กรัม)** | Number |

        #### Error Response

        | Name | Description | Type |
        | --- | --- | --- |
        | status | สถานะ | Number |
        | message | ข้อมูลอธิบาย error | String |
        | name | ชื่อ | String |
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              example: '"{\n    \"express\": \"THAI_POST\",\n    \"trackingNumbers\": [\n        \"JB052917036TH\",\n        \"JB052917037TH\",\n        \"JB052917038TH\",\n        \"JB052917039TH\",\n        \"JB052917040TH\",\n        \"JB052917041TH\",\n        \"JB052917042TH\",\n        \"JB052917043TH\",\n        \"JB050236544TH\",\n        \"JB052917035TH\",\n        \"JB050236582TH\",\n        \"JB050236579TH\",\n        \"JB050236579TH\",\n        \"JB012345678TH\"\n    ]\n}"'
