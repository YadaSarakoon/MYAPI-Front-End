  - name: Verify COD Account
    description: '![](assets/verify-cod-flow.jpg)'
paths:
  /v1/auth/oauth2/token:
    post:
      tags:
        - Authentication/​Authorization
      summary: Generate Access Token
      description: |-
        #### Request Body

        | Name | **Detail** | **Type** | **Additional information** |
        | --- | --- | --- | --- |
        | client\_id | client\_id ที่ได้รับจาก ระบบที่ Myexpress นำส่ง | String | required |
        | client\_secret | client\_secret ที่ได้รับจาก ระบบที่ Myexpress นำส่ง | String | required |
        | grant\_type | grant\_type รหัสของลูกค้าที่จะนำบันทึกลงระบบ Account Myexpress คือ client\_credentails | String | **required = client\_credentails** |
        | scope | scope ที่ได้รับจากการ access จากระบบที่ Myexpress | String | required |

        #### Response

        | **Name** | **Description** | **type** |
        | --- | --- | --- |
        | access\_token | ข้อมูลเข้ารหัส รับรองความปลอดภัยของ user | String |
        | expires\_in | ระยะเวลาที่ token หมดอายุ (second) | Number |
        | token\_type | ชนิด Token | String |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                client_id: <YOUR_CLIENT_ID>
                client_secret: <YOUR_CLIENT_SECRET>
                grant_type: client_credentials
                scope: parcel
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: OK
          headers:
            Date:
              schema:
                type: string
                example: Tue, 23 Jul 2024 08:29:48 GMT
            Content-Type:
              schema:
                type: string
                example: application/json; charset=utf-8
            Transfer-Encoding:
              schema:
                type: string
                example: chunked
            Connection:
              schema:
                type: string
                example: keep-alive
            Cache-Control:
              schema:
                type: string
                example: no-store
            pragma:
              schema:
                type: string
                example: no-cache
            x-kong-response-latency:
              schema:
                type: integer
                example: '18'
            CF-Cache-Status:
              schema:
                type: string
                example: DYNAMIC
            Report-To:
              schema:
                type: string
                example: '{"endpoints":[{"url":"https:\/\/a.nel.cloudflare.com\/report\/v4?s=A4MFFO%2BXaAmLer1jHonrYqSunmCnFGQ2Jd8yclUuBJuStekBMefz%2F3YvxNc9jAUBWlR0VF8C%2BUjacE5vAvrGsWCz8VwyRD54wj7h28rNId69Q7HpnPHzQF8t2RjLlDkULMZ3LtntJMZRHXvf"}],"group":"cf-nel","max_age":604800}'
            NEL:
              schema:
                type: string
                example: '{"success_fraction":0,"report_to":"cf-nel","max_age":604800}'
            Server:
              schema:
                type: string
                example: cloudflare
            CF-RAY:
              schema:
                type: string
                example: 8a7a4e070d337b56-BKK
            Content-Encoding:
              schema:
                type: string
                example: br
            alt-svc:
              schema:
                type: string
                example: h3=":443"; ma=86400
          content:
            application/json:
              schema:
                type: object
              example:
                expires_in: 7200
                token_type: bearer
                access_token: <ACCESS_TOKEN>
        '400':
          description: Bad Request
          headers:
            Date:
              schema:
                type: string
                example: Tue, 23 Jul 2024 09:23:19 GMT
            Content-Type:
              schema:
                type: string
                example: application/json; charset=utf-8
            Content-Length:
              schema:
                type: integer
                example: '78'
            Connection:
              schema:
                type: string
                example: keep-alive
            Cache-Control:
              schema:
                type: string
                example: no-store
            pragma:
              schema:
                type: string
                example: no-cache
            x-kong-response-latency:
              schema:
                type: integer
                example: '5'
            CF-Cache-Status:
              schema:
                type: string
                example: DYNAMIC
            Report-To:
              schema:
                type: string
                example: '{"endpoints":[{"url":"https:\/\/a.nel.cloudflare.com\/report\/v4?s=a2L6tZTaYJSF6p4qNX0msddU11jkEeBolW4b4vd96k0sTozuwQZNvFUjroJTBW%2BSPMPhGz4yp4htEroZ9zwlTU5eyLr4vQe%2Ftm6EgpZ8tWuftI6Elo%2FMFDpKiA0yxt7ijsgwJztfjCWFFzZK"}],"group":"cf-nel","max_age":604800}'
            NEL:
              schema:
                type: string
                example: '{"success_fraction":0,"report_to":"cf-nel","max_age":604800}'
            Server:
              schema:
                type: string
                example: cloudflare
            CF-RAY:
              schema:
                type: string
                example: 8a7a9c6ba8757b5e-BKK
            alt-svc:
              schema:
                type: string
                example: h3=":443"; ma=86400
          content:
            application/json:
              schema:
                type: object
              example:
                error: invalid_client
                error_description: Invalid client authentication
      security: []
  /v1/parcel:
    post:
      tags:
        - Parcel
      summary: Create Parcel (NON_COD / COD)
      description: |-
        ## ประเภท NON_COD

        #### Request Body

        | Name | Description | Type | Additional information |
        | --- | --- | --- | --- |
        | express | ชื่อขนส่ง (EN) | String | Required **"THAIPOST"** |
        | sender | ข้อมูลผู้ส่ง | Object | Required |
        | sender.name | ชื่อผู้ส่ง | String | Required |
        | sender.phoneNumber | เบอร์โทรศัพท์ที่ติดต่อได้ของผู้ส่ง | String | Required |
        | sender.address | เลขที่อยู่ผู้ส่ง | String | Required |
        | sender.subDistrict | ตำบลผู้ส่ง | String | Required |
        | sender.district | อำเภอผู้ส่ง | String | Required |
        | sender.province | จังหวัดผู้ส่ง | String | Required |
        | sender.zipCode | รหัสไปรษณีย์ผู้ส่ง | String | Required |
        | receiver | ข้อมูลผู้รับ | Object | Required |
        | receiver.name | ชื่อผู้รับ | String | Required |
