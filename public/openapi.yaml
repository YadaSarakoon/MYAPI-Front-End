openapi: 3.0.0
info:
  title: MyExpress Open API Document
  description: |-
    ## Introduction

    *   Signing Up
        
    *   API Use Suggestion
        
    *   Authentication/​Authorization
        
    *   Parcel API
        
    *   Webhook
        

    * * *

    ### Signing Up

    ![](assets/signing-up-flow.jpg)

    step 1: Partner submit google form follow this url

    *   [Google Form Link](https://forms.gle/FHuFkuTXCHW9kBTR9)

    step 2: MyExpress create Partner Account

    *   create account information
        
    *   generate client\_id & client\_secret
        
    *   setup webhook
        

    step 3: MyExpress sent client\_id & client\_secret for Test Environment

    Example client\_id & client\_secret

    ```json
    {
      "client_id": "<YOUR_CLIENT_ID>",
      "client_secret": "<YOUR_CLIENT_SECRET>"
    }

    ```

    step 4: Partner sef-test in Test Environment

    *   API Use Suggestion
        
    *   Authentication/​Authorization
        
    *   Create & Delete Parcel
        
    *   Webhook
        

    step 5: Partner plan go-live ...

    step: 6: MyExpress sent client\_id , client\_secret for Production Environment

    * * *

    ### API Suggestion

    *   URL

    | **Environment** | **Url** |
    | --- | --- |
    | Test | [https://dev-open-api.myexpress.ai](https://dev-open-api.myexpress.aiURL) |
    | Production | [https://open-api.myexpress.ai](https://open-api.myexpress.aiAPI) |

    *   Response Status Code

    | **Status** | **Detail** |
    | --- | --- |
    | 200 | Request is successful. |
    | 400 | Error bad request |
    | 401 | Error an access token is missing or unauthorized |
    | 403 | Error find an account forbidden |
    | 500 | Error internal server http request |

    *   Error Response Detail

    | Name | Description | Type |
    | --- | --- | --- |
    | status | status error code | Number |
    | error\_description | error description | String |
    | name | error name from Bad request | String |
    | error | error name | String |
    | message | detail error | String |
  version: 1.0.0
servers:
  - url: https://dev-open-api.myexpress.ai
    description: Test Environment
  - url: https://open-api.myexpress.ai
    description: Production Environment
tags:
  - name: Authentication/​Authorization
    description: |-
      All APIs on MyExpress Open API are secured with [OAuth 2.0](https://tools.ietf.org/html/rfc6749) security standards. and grant types is [Client Credentials](https://oauth.net/2/grant-types/client-credentials/)

      ![](assets/auth-oauth-flow.jpg)
  - name: Parcel
    description: |-
      ![](assets/parcel-api-sequence.jpg)

      ### รายการขนส่งที่เปิดใช้งาน

      *   ไปรษณีย์ไทย (THAI\_POST): ประเภท NON\_COD
          
      *   ไปรษณีย์ไทย (THAI\_POST): ประเภท COD
  - name: Webhook
    description: |-
      ประกอบไปด้วย

      *   Parcel Shipping Status Update (สถานะพัสดุ)

      ![](assets/webhook-workflow.jpg)

      \*Note\*

      ทาง Myexpress จะทำหน้าที่เป็นตัวกลางในการรับ event ของ webhook แล้วส่งเป็น REST API method **POST** ไปให้โดย partner จะต้องมี api เพื่อรอรับ request body สถานะพัสดุและ return response success กลับมาให้ Myexpress เมื่อ partner ได้รับสถานพัสดุสำเร็จ

      กรณีที่ response ที่ MyExpress ได้รับไม่ใช่ http status 200 (success) ระบบส่งข้อมูลให้ใหม่และส่งไม่เกิน 5 ครั้ง

      ### รายการขนส่งที่เปิดใช้งาน

      *   ไปรษณีย์ไทย (THAI\_POST): ประเภท NON\_COD และ COD

      * * *

      ### ไปรษณีย์ไทย (THAI\_POST): ประเภท NON\_COD

      ### Request Body

      ตัวอย่าง Request Body ที่ Myexpress จะส่งเป็น REST API ไปให้

      ```json
      {
        "shippingCost": {
          "totalAmount": 17,
          "shippingCost": 17,
          "codAmount": 0,
          "codFee": 0,
          "codVat": 0,
          "specialAreaCost": 0
        },
        "trackingNumber": "JBXXXXXXXXXTH",
        "expressName": "THAI_POST",
        "weightGram": 56,
        "stage": {
          "barcode": "JBXXXXXXXXXTH",
          "weight": 56,
          "cod": "no",
          "status": "2",
          "statusDescription": "ปณ.ต้นทางรับฝากแล้ว",
          "statusDate": "26/07/2024 14:13:50",
          "stationPostcode": "10121",
          "station": "สวนพลู/กรุงเทพฯ",
          "receiverName": "",
          "latitude": "13.7176545386002",
          "longtitude": "100.540133267641",
          "signature": ""
         }
      }

      ```

      ### ไปรษณีย์ไทย (THAI\_POST): ประเภท COD

      ### Request Body

      ตัวอย่าง Request Body ที่ Myexpress จะส่งเป็น REST API ไปให้

      ```json
      {
        "shippingCost": {
          "totalAmount": 19.14,
          "shippingCost": 17,
          "codAmount": 100,
          "codFee": 2,
          "codVat": 0.14,
          "specialAreaCost": 0
        },
        "trackingNumber": "JAXXXXXXXXXTH",
        "expressName": "THAI_POST",
        "weightGram": 56,
        "stage": {
          "barcode": "JAXXXXXXXXXTH",
          "weight": 56,
          "cod": "yes",
          "status": "2",
          "statusDescription": "ปณ.ต้นทางรับฝากแล้ว",
          "statusDate": "26/07/2024 14:13:50",
          "stationPostcode": "10121",
          "station": "สวนพลู/กรุงเทพฯ",
          "receiverName": "",
          "latitude": "13.7176545386002",
          "longtitude": "100.540133267641",
          "signature": ""
         }
      }

      ```

      ### Request Body Description

      | **Name** | **Description** | **Type** |
      | --- | --- | --- |
      | shippingCost.totalAmount | ราคาต้นทุนรวมทั้งหมด | Number |
      | shippingCost.shippingCost | ราคาต้นทุนขนส่ง | Number |
      | shippingCost.codAmount | ยอดเงิน COD (บาท) | Number |
      | shippingCost.codFee | ค่าธรรมเนียม COD | Number |
      | shippingCost.codVat | ภาษีมูลค่าเพิ่ม COD | Number |
      | shippingCost.specialAreaCost | ค่าพื้นที่พิเศษ พื้นที่ห่างไกล | Number |
      | trackingNumber | เลข tracking จากขนส่ง | String |
      | expressName | ชื่อขนส่ง | String |
      | weightGram | น้ำหนักพัสดุหน่วย **กรัม** | Number |
      | stage.barcode | เลข tracking จากขนส่ง | String |
      | stage.weight | น้ำหนักหน่วยเป็นกรัม ตัวอย่าง 1000 | String |
      | stage.cod | พัสดุ COD  
      ตัวอย่าง ใช่ = yes หรือ ไม่ = no | String |
      | stage.status | status code จากขนส่งดูได้จากตาราง Status Detail | String |
      | stage.statusDescription | status Description จากขนส่ง ดูได้จากตาราง Status Detail | String |
      | stage.statusDate | วันที่ เวลา ที่ได้รับสถานะ  
      ตัวอย่าง 23/07/2024 10:00:00 | String |
      | stage.stationPostcode | รหัสไปรษณีย์ตำแหน่งที่ทำการไปรษณีย์ ตัวอย่าง 10160 | String |
      | stage.station | ที่ทำการไปรษณีย์ ตัวอย่างภาษีเจริญ/กรุงเทพฯ | String |
      | stage.receiverName | ชื่อผู้รับ | String |
      | stage.atitude | ตำแหน่งละติจูดที่ทำการไปรษณีย์ | String |
      | stage.longtitude | ตำแหน่งลองติจูดที่ทำการไปรษณีย์ | String |
      | stage.signature | ลายเซ็นผู้รับ | String |

      ### Status Detail

      | **Status** | **StatusDescription** | **StatusDescription EN** |
      | --- | --- | --- |
      | 0 | ผู้ฝากนำข้อมูลสินค้าเข้าระบบแล้ว | preload item data in to system |
      | 1 | ผู้ฝากสร้างใบฝากส่งเข้าระบบแล้ว | Preparing to ship. |
      | 2 | ปณ.ต้นทางรับฝากแล้ว | Received from source postoffice. |
      | 3 | ถึง ปณ.ปลายทาง เตรียมนำจ่าย | Destination postoffice prepare to pay package. |
      | 4 | นำจ่ายถึงผู้รับแล้ว | Successful delivery |
      | 5 | ปณ.ปลายทางส่งคืน | destination postoffice send a returned item |
      | 6 | ปณ.ต้นทางส่งคืนบริษัท | source postoffice send a returned item to sender |
      | 7 | ของสูญหาย | lost item |
      | 8 | เลื่อนวันรับของ | receiver postpone to receive item |
      | 9 | นำจ่าย/ชำระเงินเรียบร้อย | Successful delivery and collect COD money |
