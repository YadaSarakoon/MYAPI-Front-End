  /v1/account/sender-cod:
    post:
      tags:
        - Verify COD Account
      summary: Create Sender COD
      description: |-
        #### Request Body

        | **Name** | **Description** | **Type** | **Additional information** |
        | --- | --- | --- | --- |
        | bankAccount | ข้อมูลบัญชีธนาคาร | Object | Required |
        | bankAccount.bankInitial | อักษรย่อธนาคาร | String | Required  
        **ค่าที่เป็นไปได้**  
        KBANK, SCB, BBL, KTB, TMB, BAY |
        | bankAccount.holderName | ชื่อบนสมุดบัญชีธนาคาร | String | Required |
        | bankAccount.number | หมายเลขสมุดบัญชีธนาคาร | String | Required |
        | bankAccount.bookBankImage | ภาพถ่ายหน้าสมุดบัญชีธนาคาร | String | Required  
        (ข้อมูลที่ได้จากการอัพโหลดกับระบบ) |
        | identification | ข้อมูลการยืนยันตัวตน | Object | Required |
        | identification.number | หมายเลขประจำตัวประชาชน / หมายเลขนิติบุคคล | String | Required |
        | identification.image | ภาพถ่ายบัตรประชาชน / ภาพถ่ายหนังสือรับรองบริษัท | String | Required  
        (ข้อมูลที่ได้จากการอัพโหลดกับระบบ) |
        | identification.selfPicture | ภาพถ่ายหน้าตรงคู่กับบัตรประชาชน | String | Required กรณีที่เป็นประเภทบุคคลธรรมดา  
        (ข้อมูลที่ได้จากการอัพโหลดกับระบบ) |
        | identification.type | ประเภทบัญชี COD | String | Required  
        **ค่าที่เป็นไปได้**  
        PERSON, LEGAL\_ENTITY |
        | name | ชื่อผู้ส่ง | String | Required |
        | phoneNumber | เบอร์โทรศัพท์ผู้ส่ง | String | Required |
        | email | อีเมลผู้ส่ง | String | Required |
        | address | ที่อยู่ผู้ส่ง | String | Required |
        | subDistrict | ตำบลผู้ส่ง | String | Required |
        | district | อำเภอผู้ส่ง | String | Required |
        | province | จังหวัดผู้ส่ง | String | Required |
        | zipCode | รหัสไปรษณีย์ผู้ส่ง | String | Required |

        **ฟิลด์** bankAccount.bookBankImage: รูปภาพหน้าสมุดบัญชีธนาคาร

        **ฟิลด์** identification.image: รูปภาพสำหรับการยืนยันตัวตนจะแตกต่างกันไปตามประเภทของผู้ใช้งาน:

        *   **บุคคลธรรมดา**: ต้องอัปโหลดรูปภาพ **บัตรประชาชน**
            
        *   **นิติบุคคล**: ต้องอัปโหลดรูปภาพ **หนังสือรับรองบริษัท**
            

        **ฟิลด์** identification.selfPicture: รูปภาพใช้สำหรับกรณีที่ผู้ใช้งานเป็นบุคคลธรรมดาเท่านั้น

        *   ถ่ายรูปตนเอง **หน้าตรง** พร้อมถือ **บัตรประชาชน** แนบกับใบหน้า และให้เห็นบัตรประชานอย่างชัดเจน

        #### **การอัปโหลดไฟล์รูปภาพสำหรับฟิลด์ต่าง ๆ**

        สำหรับฟิลด์ bankAccount.bookBankImage, identification.image และ identification.selfPicture

        ผู้ใช้งานจำเป็นต้องอัปโหลดไฟล์รูปภาพที่เกี่ยวข้องจาก Upload Image API

        *   เมื่ออัปโหลดสำเร็จ ระบบจะสร้าง **directory path** ของไฟล์ที่ถูกจัดเก็บ
            
        *   ผู้ใช้งานต้องนำ directory path มาใส่ตามฟิลด์ bankAccount.bookBankImage, identification.image และ identification.selfPicture ให้ตรงตามประเภท
            
        *   directory path จะต้องมาจาก Upload Image API เท่านั้น เพราะจะมีผลกับการตรวจสอบข้อมูลต่อไป
            

        #### ตารางแสดงชื่ออักษรย่อธนาคารที่ระบบรองรับ

        | **Bank Initial** | **ธนาคาร** |
        | --- | --- |
        | KBANK | ธนาคารกสิกรไทย |
        | SCB | ธนาคารไทยพาณิชย์ |
        | BBL | ธนาคารธนาคารกรุงเทพไทย |
        | KTB | ธนาคารกรุงไทย |
        | TMB | ธนาคารทหารไทยธนชาต |
        | BAY | ธนาคารกรุงศรี |

        #### Response

        | **Name** | **Description** | **Type** |
        | --- | --- | --- |
        | message | ข้อมูลสถานะการสร้างบัญชี COD | String |
        | data | ข้อมูลตอบกลับหลังจากการสร้างสร้างบัญชี COD | Object |

        ##### Data Detail

        | **Name** | **Description** | **Type** |
        | --- | --- | --- |
        | bankAccount | ข้อมูลผู้ส่ง | Object |
        | bankAccount.bankFullName | ชื่อเต็มธนาคาร | String |
        | bankAccount.bankInitial | อักษรย่อธนาคาร | String |
        | bankAccount.holderName | ชื่อบนสมุดบัญชีธนาคาร | String |
        | bankAccount.number | หมายเลขสมุดบัญชีธนาคาร | String |
        | bankAccount.bookBankImage | ภาพถ่ายหน้าสมุดบัญชีธนาคาร | String |
        | approval | สถานะการอนุมัติ | String |
        | updateApprovalDate | เวลาการอนุมัติ | String |
        | name | ชื่อผู้ส่ง | String |
        | phoneNumber | เบอร์โทรศัพท์ผู้ส่ง | String |
        | email | อีเมลผู้ส่ง | String |
        | address | ที่อยู่ผู้ส่ง | String |
        | subDistrict | ตำบลผู้ส่ง | String |
        | district | อำเภอผู้ส่ง | String |
        | province | จังหวัดผู้ส่ง | String |
        | zipCode | รหัสไปรษณีย์ผู้ส่ง | String |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                bankAccount:
                  bankInitial: KBANK
                  holderName: Test
                  number: '0000000000'
                  bookBankImage: mxp-bookbank-cod-image/mxp-bookbank-cod-image/1707213724144.png
                identification:
                  number: '1111111111111'
                  image: mxp-indentification-cod-image/mxp-indentification-cod-image/idCard-1707213724148.png
                  selfPicture: mxp-indentification-cod-image/mxp-indentification-cod-image/PersonIdCard-1707213724149.png
                  type: PERSON
                name: Test
                phoneNumber: '0900000000'
                email: test@test.com
                address: 99/9
                subDistrict: เกาะขวาง
                district: เมืองจันทบุรี
                province: จันทบุรี
                zipCode: '22000'
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer <YOUR_ACCESS_TOKEN>
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
              examples:
                example-0:
                  summary: Success (บุคคลธรรมดา)
                  value:
                    message: create sender cod success
                    data:
                      bankAccount:
                        bankFullName: ธนาคารกสิกรไทย (KBANK)
                        bankInitial: KBANK
                        holderName: Test
                        number: '00000000000'
                        bookBankImage: mxp-bookbank-cod-image/mxp-bookbank-cod-image/Cert-1707213724144.png
                      approval: PENDING
                      updateApprovalDate: '2024-10-09 06:07:06'
                      name: Test
